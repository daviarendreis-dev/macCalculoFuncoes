<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Ondas Sonoras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <h1>🎛️ Analisador de Ondas</h1>
            <div class="controls">
                <button id="startBtn" title="Iniciar captura do microfone">🎙 Iniciar captura</button>
                <button id="stopBtn" disabled title="Parar a captura e analisar">⏸ Parar</button>
                <button id="clearBtn" title="Limpar gráfico e resultados">🗑 Limpar</button>
            </div>
            <div class="zoom-controls">
                <button id="zoomOutBtn" title="Zoom out">−</button>
                <span id="zoomLevel">1.0×</span>
                <button id="zoomInBtn" title="Zoom in">+</button>
                <button id="zoomResetBtn" title="Resetar zoom">⟲</button>
            </div>
            <div id="statusMsg" class="status-badge">🔇 Pronto</div>
        </header>

        <main class="stage">
            <div class="canvas-wrapper">
                <canvas id="waveCanvas" width="800" height="400"></canvas>
            </div>

            <aside class="sidebar">
                <div id="resultsPanel" class="results-panel visible">
                    <div class="result-item">
                        <span class="result-label">📊 Frequência:</span>
                        <span id="freqValue" class="result-value">— Hz</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">🔊 RMS:</span>
                        <span id="rmsValue" class="result-value">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">📈 Nível:</span>
                        <span id="dbValue" class="result-value">— dBFS</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">📐 RMS / escala total:</span>
                        <span id="normValue" class="result-value">— %</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">📏 Amplitude de pico (A):</span>
                        <span id="amplitudeValue" class="result-value">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">⏱ Período (T):</span>
                        <span id="periodValue" class="result-value">— ms</span>
                    </div>
                    <div class="result-item func-item">
                        <span class="result-label">🧮 Função:</span>
                        <button id="showFunctionBtn" class="function-toggle" type="button" hidden>Mostrar função</button>
                        <span id="funcValue" class="result-value function-line" hidden></span>
                    </div>
                </div>

            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
