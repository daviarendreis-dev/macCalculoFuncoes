<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Analisador de Ondas Sonoras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <h1>🎛️ Analisador de Ondas</h1>
            <div class="controls">
                <button id="startBtn" title="Iniciar geração de onda e som">▶ Iniciar</button>
                <button id="stopBtn" disabled title="Congelar e analisar">⏸ Parar</button>
                <button id="clearBtn" title="Limpar gráfico e resultados">🗑 Limpar</button>
            </div>
            <div class="zoom-controls">
                <button id="zoomOutBtn" title="Zoom out">−</button>
                <span id="zoomLevel">1.0×</span>
                <button id="zoomInBtn" title="Zoom in">+</button>
                <button id="zoomResetBtn" title="Resetar zoom">⟲</button>
            </div>
            <div id="statusMsg" class="status-badge">🔇 Pronto</div>
        </header>

        <main class="stage">
            <div class="canvas-wrapper">
                <canvas id="waveCanvas" width="800" height="400"></canvas>
            </div>

            <aside class="sidebar">
                <div id="resultsPanel" class="results-panel visible">
                    <div class="result-item">
                        <span class="result-label">📊 Frequência:</span>
                        <span id="freqValue" class="result-value">— Hz</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">🔊 RMS:</span>
                        <span id="rmsValue" class="result-value">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">📈 Volume:</span>
                        <span id="dbValue" class="result-value">— dB</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">📐 Nível:</span>
                        <span id="normValue" class="result-value">— %</span>
                    </div>
                    <div class="result-item func-item">
                        <span class="result-label">🧮 Função:</span>
                        <span id="funcValue" class="result-value function-line">—</span>
                    </div>
                </div>

                <div class="spectrum-container">
                    <canvas id="spectrumCanvas" width="800" height="120"></canvas>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
